[project]
name = "splunky-finance-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1", "uvicorn>=0.35,<1", "pydantic>=2.11.9,<3",
  "pydantic-settings>=2.10,<3", "itsdangerous>=2.2,<3", "argon2-cffi>=25.1,<26",
  "filelock>=3.19,<4", "httpx>=0.28,<1",
  "langchain==1.4.0", "langchain-openai==1.6.2",
  "langchain-anthropic==1.7.2", "langchain-ollama==1.1.0",
  "galileo[langchain]==2.6.0", "agent-control-sdk[galileo]==8.7.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.13,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
